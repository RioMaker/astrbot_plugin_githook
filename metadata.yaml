name: astrbot_plugin_githook
display_name: githook
short_desc: 自动发现插件仓库，逐个勾选推送与提交历史。
desc: 自动发现指定 GitHub 账号下 astrbot_plugin_ 开头的仓库，在 AstrBot 配置中生成默认关闭的逐插件开关，手动勾选后向已开启的群推送，支持提交历史和安装状态查询。
version: "0.3.0"
author: Rio
repo: "https://github.com/RioMaker/astrbot_plugin_githook"
astrbot_version: ">=4.24.0"
support_platforms:
  - aiocqhttp
